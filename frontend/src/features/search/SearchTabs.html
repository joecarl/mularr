<!-- One tab per search; each has its own results on the backend (see SearchTabs.ts) -->
<div class="ui-panel-raised search-tabs" data-cb="tabsBar">
	<div class="search-tabs-list" data-cb="tabsContainer">
		<div class="ui-btn search-tab" data-cb="tabItem" role="tab">
			<span class="search-tab-label" data-cb="tabLabel"></span>
			<span class="search-tab-close" data-cb="tabClose" role="button" title="Close this search">×</span>
		</div>
	</div>
</div>
