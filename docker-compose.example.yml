services:
    mularr:
        image: ghcr.io/joecarl/mularr
        container_name: mularr
        restart: unless-stopped
        user: '1000:1000' # Change this to match your user id and group id for proper file permissions on the host (optional, but recommended)

        # Use the network of the Gluetun container if needed
        # If using Gluetun, make sure to set GLUETUN_ENABLED=true so the public vpn forwarded port is automatically updated in amule config.
        network_mode: service:my-gluetun-container

        # Or for standalone use, you can expose the ports directly and connect to amule running on the host or another container
        # You cannot use both network_mode and ports at the same time, so make sure to choose the right configuration based on your setup. If using network_mode with Gluetun, the mularr api port must be exposed in the Gluetun container.
        ports:
            - '8940:8940'

        volumes:
            - ./data:/app/data
            # Mount additional volumes as needed
            - /my-storage:/my-storage

        environment:
            # All environment variables are optional, the values specified here are the defaults which will be used if not provided. Set these if you want to customize the behavior or integrate with other services.

            # Directory where Mularr keeps its data: the SQLite databases, the aMule configuration (amule.conf, known.met, ...) and the JWT secret. Make sure it is backed by a volume (see above) and writable by the container.
            # DATABASE_PATH (path to the SQLite file) is deprecated: it still works, but logs a warning at startup. Use DATA_DIR instead.
            - DATA_DIR=/app/data

            # Port for the mularr web/api
            - PORT=8940

            # Minimum log level: debug | info | warn | error. debug also logs every request from Sonarr/Radarr, the search progress and the full Torznab responses.
            - LOG_LEVEL=info

            # Telegram bot integration settings if you want to receive notifications about system events, transfer completions, etc. (optional)
            - TELEGRAM_BOT_TOKEN=
            - TELEGRAM_CHAT_ID=
            - TELEGRAM_TOPIC_ID=

            # Gluetun integration will update the aMule ports automatically if GLUETUN_ENABLED is true (if using Gluetun)
            - GLUETUN_ENABLED=false
            - GLUETUN_API=http://localhost:8000/v1
            - GLUETUN_PORT_INDEX= # example: 0. When Gluetun forwards multiple ports, use this index of the "ports" array instead of the default "port" value. Leave empty to keep the default behavior.

            # Customize the incoming and temp directory directory if needed
            - AMULE_INCOMING_DIR= # example: /my-storage/downloads/mularr
            - AMULE_TEMP_DIR= # example: /my-storage/downloads/mularr/.incomplete
            # Permission mask for files and folders created by Mularr and aMule (downloads, config, database). Default is 022 (files 644, dirs 755).
            # Set it to 002 (files 664, dirs 775) if other users of the same group, e.g. Sonarr/Radarr running under a different UID, need to modify, delete or hardlink the downloaded files.
            - UMASK= # example: 002
            # Shared directories (semicolon-separated absolute paths). When either of these is set,
            # shared directories are managed at startup and become read-only in Settings.
            - AMULE_SHAREDDIR_RECURSIVE= # example: /my-storage/library;/my-storage/series
            - AMULE_SHAREDDIR_EXPLICIT= # example: /my-storage/manual-share
            - AMULE_RESTART_INTERVAL_HOURS=12 # How often (in hours) the monitoring service automatically restarts the aMule daemon. Set to `0` to disable.
            # Seed limits: how long a finished download keeps being shared before Sonarr/Radarr (using Mularr as a qBittorrent download
            # client) may remove it. With both at 0 (default) they move the file into the library and delete the download right after
            # import. Set a ratio (uploaded/size, e.g. 1) and/or a number of minutes since completion (e.g. 4320 for 3 days) to keep
            # sharing instead: they then copy the file on import and remove the download, and its file, once either limit is reached.
            # The Seed Ratio / Seed Time of an indexer in Sonarr/Radarr, when set, override these for the downloads grabbed from it.
            - SEED_RATIO_LIMIT=0
            - SEED_TIME_LIMIT_MINUTES=0

            # Download priority aMule gives to releases grabbed from Hispashare: low | normal | high | very_high | off.
            # Hispashare releases are the Spanish eD2k catalogue the user wants first, so they default to high.
            # Set it to off to leave the priority aMule chose untouched.
            - HISPASHARE_DOWNLOAD_PRIORITY=high

            # Keep Hispashare downloads sharing after completion. When true (default), the seed ratio/time
            # Sonarr/Radarr set on a Hispashare download are stored as -1 (no limit of that kind), so the *arr
            # never remove it and aMule keeps serving the file. Set to false to let the *arr remove it as usual.
            - HISPASHARE_KEEP_SHARING=true

            # Auth (if no auth env vars are set, the web interface and API will be open without authentication, so make sure to set these if you are exposing the web interface or API to untrusted networks)
            - AUTH_USERNAME= # example: admin. Used to login to the mularr web interface and the qbitorrent api
            - AUTH_PASSWORD= # example: admin. Used to login to the mularr web interface and the qbitorrent api
            - API_KEY= # example: supersecretapikey. Used to authenticate API requests from other apps without login (needed for torznab integration, for example. API_KEY can also be used as password with the username 'apikey' for the qbittorrent api)
            - JWT_SECRET= # example: supersecretjwtkey. Used to sign JSON Web Tokens for API authentication. If not set, a random secret is generated on first startup and stored in a 'jwt-secret' file in the data directory (next to the database), so tokens remain valid across restarts. Only set this if you want to control the secret yourself.

            # [EXPERIMENTAL] External connection (EC) client settings used by Mularr to reach aMule.
            # Mularr is designed to work with the aMule instance it manages internally, so you should
            # NOT set these unless you fully understand the implications. Changing them means connecting
            # to an external aMule instance, a use case Mularr does not currently fully support or test.
            # AMULE_EC_CLIENT_PASSWORD is only the client password used to authenticate the EC connection;
            # it is NOT used to modify the internal aMule configuration. To change the EC password itself,
            # edit the aMule configuration file (amule.conf) manually.
            - AMULE_EC_CLIENT_HOST=localhost
            - AMULE_EC_CLIENT_PORT=4712
            - AMULE_EC_CLIENT_PASSWORD=secret
